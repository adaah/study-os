name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite disparar a compilação manualmente pela interface do GitHub

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependências do projeto
        run: npm install

      - name: 6. Compilar Web e Sincronizar Capacitor
        run: npm run cap:build

      - name: 7. Dar permissão de execução ao Gradle
        run: chmod +x ./android/gradlew

      - name: 8. Compilar APK Debug via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 9. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
